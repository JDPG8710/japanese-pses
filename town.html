<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f3e9">
  <title>Piko Learning Town · Maths & English Roleplay for Kids</title>
  <meta name="description" content="Explore Piko Town with friends, play eleven learning and arcade games, earn town points through twenty levels, and keep playing in endless challenge mode.">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <link rel="canonical" href="https://piko-game.com/town">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Piko Game">
  <meta property="og:title" content="Piko Learning Town · Open for business!">
  <meta property="og:description" content="A little town. Your first shop. Learn maths and English through everyday adventures.">
  <meta property="og:url" content="https://piko-game.com/town">
  <meta property="og:image" content="https://piko-game.com/assets/seo/piko-game-en.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="src/town/town.css?v=3">
  <link rel="stylesheet" href="src/town/expansion.css?v=3">
  <link rel="stylesheet" href="src/arcade/arcade.css?v=3">
  <link rel="stylesheet" href="src/town/multiplayer.css?v=1">
  <style>
  [data-town-loading]{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:#edf5ee;color:#254c43;font:16px system-ui;padding:24px}[data-town-loading]>div{width:min(440px,100%);padding:30px;border-radius:26px;background:#ffffffef;box-shadow:0 18px 70px #315b4020;text-align:center}[data-town-loading] .loading-town-art{font-size:56px;letter-spacing:8px;margin-bottom:16px}[data-town-loading] h2{font-size:24px;line-height:1.4;margin:10px 0}[data-town-loading] progress{display:block;width:100%;height:18px;margin:22px 0 10px;accent-color:#518776}[data-load-percent]{font-weight:700;font-size:24px}[data-load-status]{min-height:48px;line-height:1.5;color:#5f786d;margin:14px 0}[data-town-loading] button{min-height:48px;padding:8px 22px;border:0;border-radius:10px;background:#365e52;color:white;font:600 16px system-ui}[data-game-preload]{position:fixed;right:12px;bottom:12px;z-index:30;border-radius:12px;background:#fffffff0;color:#345b4e;box-shadow:0 4px 16px #25433420;padding:10px 14px;font:12px system-ui;pointer-events:none}[data-town-loading][hidden],[data-game-preload][hidden]{display:none!important}
  </style>
</head>
<body>
  <section data-town-loading data-progress="0" aria-label="Town loading" role="status"><div><div class="loading-town-art" aria-hidden="true">✳ ⌂ 🌳</div><small>PIKO TOWN</small><h2>Preparing Piko Town</h2><progress max="100" value="0" aria-label="Town loading progress"></progress><strong data-load-percent>0%</strong><p data-load-status>Loading town and games…</p><button type="button" hidden>Reload</button></div></section>
  <div data-game-preload hidden role="status" aria-live="polite"></div>
  <header class="town-header"><a class="brand" href="/"><span class="brand-star">✳</span> Piko <span>Town</span></a><nav><a id="world-link" href="/">Home</a><button id="help" class="icon-button" type="button">?</button><button id="character" type="button">My character</button><label><span class="sr-only">Language / 语言 / ことば</span><select id="locale"><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option></select></label></nav></header>
  <main class="town-main">
    <section class="page-heading"><div><p class="eyebrow" id="town-eyebrow">PIKO TOWN · 3D ADVENTURES</p><h1 id="town-title">Piko Learning Town</h1><p id="town-tag"></p></div><div class="wallet"><span>✦ <b id="coins">0</b><small id="coins-label"></small></span><span>✧ <b id="xp">0</b><small id="xp-label"></small></span></div></section>
    <section id="town-progression" class="town-progression" aria-live="polite"></section>
    <section id="town-online"></section>
    <div class="town-layout">
      <section class="world-card" id="town-map" aria-label="Town map">
        <div class="world-top"><span class="live-dot"></span><span id="chapter"></span><span class="weather" aria-hidden="true">☀ 24°</span></div>
        <div class="map-caption"><span id="walk-tip"></span><span class="compass" aria-hidden="true">N ↑</span></div>
        <div class="scene-viewport">
        <canvas id="town-canvas" tabindex="0" aria-label="Town map. Use arrow keys to walk and E to talk, or use the place buttons below."></canvas>
        </div>
        <div class="world-controls"><div class="dpad" id="town-dpad" aria-label="Movement"><button data-direction="ArrowUp" aria-label="↑" type="button">↑</button><button data-direction="ArrowLeft" aria-label="←" type="button">←</button><button data-direction="ArrowDown" aria-label="↓" type="button">↓</button><button data-direction="ArrowRight" aria-label="→" type="button">→</button></div><button id="interact" class="primary" type="button" disabled></button></div>
      </section>
      <aside class="quest-panel"><p class="eyebrow" id="mission-label"></p><div class="quest-number" id="mission-number"></div><h2 id="mission-title"></h2><p id="mission-objective"></p><button id="go-mission" class="primary" type="button"></button><div class="story-progress"><div><span id="progress-label"></span><b id="progress-count"></b></div><progress id="progress" max="10" value="0"></progress></div><details class="journal"><summary id="journal-label"></summary><ol id="journal"></ol></details><div class="note"><span aria-hidden="true">🌱</span><p id="local-note"></p></div></aside>
    </div>
    <nav class="place-links" id="town-places" aria-label="Places in town"><button data-travel="guide" type="button"><span>✳</span><div><b id="guide-label"></b><small id="guide-sub">PIKO SQUARE</small></div><i>↗</i></button><button data-travel="shop" type="button"><span>🛍</span><div><b id="shop-label"></b><small id="shop-sub">SUNSHINE SHOP</small></div><i>↗</i></button><button data-travel="home" type="button"><span>⌂</span><div><b id="home-label"></b><small id="home-sub">MY HOME</small></div><i>↗</i></button></nav>
    <p id="save-status" class="save-status" role="status" aria-live="polite"></p>
  </main>
  <footer><span id="town-footer">✳ Piko Game · Made for little discoveries.</span><div><a id="town-guide-link" href="/en/guides/town-shop">Shop example, step by step</a><a id="privacy-link" href="privacy">Privacy</a><a id="terms-link" href="terms">Terms</a></div></footer>
  <dialog id="town-dialog" aria-labelledby="dialog-title"><div id="dialog-body"></div></dialog>
  <noscript><style>[data-town-loading]{display:none!important}</style><p>This town needs JavaScript. 请启用 JavaScript 来探索小镇。JavaScriptを有効にしてください。</p></noscript>
  <script type="module" src="src/town/TownBootstrap.mjs"></script>
</body>
</html>
