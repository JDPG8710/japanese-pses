name = "japanese-pses"
main = "worker/index.js"
compatibility_date = "2026-08-24"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
APP_ORIGIN = "https://japanese-pses.j565718319.workers.dev"
API_ORIGIN = "https://japanese-pses.j565718319.workers.dev"
DEV_ORIGINS = "http://localhost:4173,http://127.0.0.1:4173"
TURNSTILE_HOSTNAME = "japanese-pses.j565718319.workers.dev"
GOOGLE_CLIENT_ID = "406705820118-aa4p2gkig81k4fn9ofh4igs0v6lku7ep.apps.googleusercontent.com"
APPLE_CLIENT_ID = "REPLACE_WITH_APPLE_SERVICES_ID"

[observability]
enabled = true
head_sampling_rate = 1

[[kv_namespaces]]
binding = "SESSION_KV"
id = "2fb44af92bba41519654e51a8b25b0b5"
preview_id = "4eabeb32053f4306b2165983fa7c6caf"

[[kv_namespaces]]
binding = "GUEST_KV"
id = "4b7406adb62b41aa8af38a5970f6730e"
preview_id = "ecb569dbcf1b403493467ad0fc25830f"

[[r2_buckets]]
binding = "GAME_DATA_R2"
bucket_name = "japanese-pses-game-data"
preview_bucket_name = "japanese-pses-game-data-preview"

# 機密値はコミットせず、次のコマンドで登録してください。
# npx wrangler secret put TURNSTILE_SECRET_KEY
# npx wrangler secret put GOOGLE_CLIENT_SECRET
# npx wrangler secret put APPLE_CLIENT_SECRET
# npx wrangler secret put JWT_SECRET
# npx wrangler secret put FINGERPRINT_PEPPER
