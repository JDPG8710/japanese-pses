<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Piko · 数学漫画 / Math comics</title><style>body{max-width:850px;margin:40px auto;padding:20px;background:#fffaf0;color:#193e3b;font:18px/1.7 system-ui}h1{font-size:32px}nav{display:flex;flex-wrap:wrap;gap:16px}button,select{font:inherit;min-height:56px;border:2px solid #245653;border-radius:14px;background:white;color:#193e3b;padding:14px;cursor:pointer}img{width:100%;max-width:450px;border-radius:16px;margin:24px 0}button:focus-visible{outline:4px solid #b85330}</style></head><body><h1>Piko · 数学漫画 / Math comics</h1><select aria-label="中文 / 日本語 / English"><option value="zh">中文</option><option value="ja">日本語</option><option value="en">English</option></select><p id="note"></p><nav></nav><img src="../../assets/comics/piko-math-scenes.png" alt="Piko"><script type="module">import {COMICS,openMathComic} from './MathComic.mjs';const select=document.querySelector('select');function render(){const locale=select.value;document.documentElement.lang=locale;document.querySelector('#note').textContent=({zh:'教材预览 · 每课4格 · 阅读不计通关',ja:'きょうざいプレビュー · 4コマ · よむだけでは クリアに なりません',en:'Lesson preview · four panels each · reading does not award a pass'})[locale];const nav=document.querySelector('nav');nav.replaceChildren();for(const [id,c] of Object.entries(COMICS)){const b=document.createElement('button');b.textContent=c.title[locale];b.onclick=()=>openMathComic(id,locale);nav.append(b);}}select.onchange=render;render();</script></body></html>
