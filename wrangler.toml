name = "japanese-pses"
main = "worker/index.js"
compatibility_date = "2026-08-24"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
APP_ORIGIN = "https://japanese-pses.j565718319.workers.dev"
API_ORIGIN = "https://japanese-pses.j565718319.workers.dev"
DEV_ORIGINS = "http://localhost:4173,http://127.0.0.1:4173"
TURNSTILE_HOSTNAME = "japanese-pses.j565718319.workers.dev"
GOOGLE_CLIENT_ID = "406705820118-aa4p2gkig81k4fn9ofh4igs0v6lku7ep.apps.googleusercontent.com"
APPLE_CLIENT_ID = "REPLACE_WITH_APPLE_SERVICES_ID"

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "japanese-pses-production"
database_id = "b04eb538-8972-4650-a3bf-56236fde9b41"
preview_database_id = "b04eb538-8972-4650-a3bf-56236fde9b41"
migrations_dir = "migrations"

# 機密値はコミットせず、次のコマンドで登録してください。
# npx wrangler secret put TURNSTILE_SECRET_KEY
# npx wrangler secret put GOOGLE_CLIENT_SECRET
# npx wrangler secret put JWT_SECRET
# npx wrangler secret put FINGERPRINT_PEPPER
