name = "japanese-pses"
main = "worker/arena-entry.mjs"
workers_dev = false
compatibility_date = "2026-08-24"
compatibility_flags = ["nodejs_compat"]

[vars]
GO_AI_MAX_ROOMS = "8"
GO_AI_MAX_UNITS = "16"
GO_AI_SLOW_MS = "250"
APP_ORIGIN = "https://piko-game.com"
API_ORIGIN = "https://piko-game.com"
PLAY_COUNT_ORIGINS = "https://piko-game.com,https://manabi-pop.pages.dev"
DEV_ORIGINS = "http://localhost:4173,http://127.0.0.1:4173"
TURNSTILE_HOSTNAMES = "piko-game.com,manabi-pop.pages.dev"
GOOGLE_CLIENT_ID = "406705820118-aa4p2gkig81k4fn9ofh4igs0v6lku7ep.apps.googleusercontent.com"
APPLE_CLIENT_ID = "REPLACE_WITH_APPLE_SERVICES_ID"
# Google H5 Games Ads の公開Publisher ID（例: ca-pub-123...）は取得後に設定します。
# GOOGLE_H5_ADS_CLIENT = "ca-pub-..."

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "japanese-pses-production"
database_id = "b04eb538-8972-4650-a3bf-56236fde9b41"
preview_database_id = "b04eb538-8972-4650-a3bf-56236fde9b41"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "GO_ROOMS"
class_name = "GoRoom"

[[durable_objects.bindings]]
name = "GO_LOBBY"
class_name = "GoLobby"

[[migrations]]
tag = "go-v1"
new_sqlite_classes = ["GoRoom", "GoLobby"]

[[durable_objects.bindings]]
name = "PLAYROOMS"
class_name = "PlayroomSpace"

[[migrations]]
tag = "playroom-v1"
new_sqlite_classes = ["PlayroomSpace"]

[[durable_objects.bindings]]
name = "CHESS_ROOMS"
class_name = "ChessRoom"

[[migrations]]
tag = "chess-v1"
new_sqlite_classes = ["ChessRoom"]

# 機密値はコミットせず、次のコマンドで登録してください。
# npx wrangler secret put TURNSTILE_SECRET_KEY
# npx wrangler secret put GOOGLE_CLIENT_SECRET
# npx wrangler secret put JWT_SECRET
# npx wrangler secret put STRIPE_SECRET_KEY
# npx wrangler secret put STRIPE_WEBHOOK_SECRET
